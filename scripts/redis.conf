# Music Monitor 内置 Redis 配置
# unixsocket 避免暴露端口; appendonly 持久化到 /config/redis (映射到宿主机 config 卷)
bind 127.0.0.1
port 0
unixsocket /tmp/redis.sock
unixsocketperm 770
appendonly yes
appendfilename "appendonly.aof"
dir /config/redis
# 禁用 RDB 快照, 仅用 AOF 持久化 (减少磁盘 IO)
save ""
databases 16
maxmemory 256mb
maxmemory-policy allkeys-lru
loglevel notice
