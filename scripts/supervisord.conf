; Music Monitor supervisord 配置
; 管理三个进程: redis-server / API (uvicorn) / arq worker
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; --- Redis (内置, 同容器, 不新增容器) ---
[program:redis]
command=redis-server /etc/music-monitor/redis.conf
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/redis.out.log
stderr_logfile=/tmp/redis.err.log

; --- API 主进程 ---
[program:api]
command=python main.py
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/api.out.log
stderr_logfile=/tmp/api.err.log

; --- arq 任务 worker ---
[program:worker]
command=python -m app.workers.worker
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/worker.out.log
stderr_logfile=/tmp/worker.err.log
