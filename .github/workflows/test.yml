name: Tests

# ============================================================================
# 测试门禁 (Test Gate)
# ----------------------------------------------------------------------------
# 这个 workflow 是合入 main 之前的硬门禁：
#   * PR 与 push 都会触发；
#   * docker-publish.yml 的镜像构建通过 `needs: pytest` 依赖本 job，
#     测试不过就不会有镜像产出。
#
# 覆盖率策略（ratchet 棘轮）：
#   QA 本地实测 `--cov=app` = 22%（72 条用例，Python 3.13）。
#   阈值先定 20%，留 2 个点吸收跨平台差异，作用是**防止继续下滑**而不是拔高。
#   每补一批测试就把这个数字往上抬一级：20 -> 30 -> 45 -> 60。
#   注意：暂时只统计 app/，不含 core/。core 里大量是启动期/调度器代码，
#   单测很难覆盖，一并统计会把分母冲得很难看，反而让阈值失去意义。
# ============================================================================

on:
  # 任何 PR 都跑（把 "Tests / pytest" 设为分支保护的 required status check）
  pull_request:
  # push 到 main 的场景由 docker-publish.yml 通过 workflow_call 复用本 workflow 触发，
  # 这里 ignore 掉 main 以免同一次提交跑两遍。
  push:
    branches-ignore: [ "main" ]
  # 供 docker-publish.yml 以 `uses: ./.github/workflows/test.yml` 方式复用，
  # 从而实现"测试不过 -> 不构建镜像"的硬依赖（needs: pytest）。
  workflow_call:
  workflow_dispatch:

concurrency:
  # 带上 github.workflow：被复用调用时该变量取的是调用方(Docker)的名字，
  # 这样独立运行与被复用运行落在不同的并发组，不会互相 cancel 掉门禁。
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 是 Dockerfile 的运行时版本，必须保证绿；
        # 3.13 是开发机常见版本，提前暴露新版本不兼容问题。
        # 如果 3.13 因三方库（wechatpy / opencc 等）暂时装不上，
        # 可临时改成 `python-version: ["3.11"]` 单版本，但别把整个门禁关掉。
        python-version: [ "3.11", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ------------------------------------------------------------------
      # 阻断式 lint：只拦"运行时必炸"的错误
      #   E9  语法错误
      #   F63 恒真/恒假比较等断言陷阱
      #   F7  语法层面的控制流错误
      #   F82 未定义名称 (F821)  <- 上线即 NameError
      # QA 已实测：app / core / main.py / version.py / alembic / tests / scripts 这几处
      # 当前 0 命中（scripts/refresh_quality.py 已确认 import json 无缺失），
      # 所以本步骤从第一天起就是绿的，可以放心当硬门禁。
      # ------------------------------------------------------------------
      - name: Lint (ruff · 致命错误，阻断)
        run: ruff check app core main.py version.py alembic tests scripts --select E9,F63,F7,F82 --output-format=github

      # ------------------------------------------------------------------
      # 非阻断式 lint：把技术债晒出来但不拦车
      # 目前已知 5 条（均为 F811 重复导入）。清零后请把这一步合并进上面的
      # 阻断步骤，并删掉 continue-on-error。
      # ------------------------------------------------------------------
      - name: Lint (ruff · 全量扫描，仅报告)
        continue-on-error: true
        run: ruff check . --select E9,F63,F7,F82,F811 --output-format=github

      - name: Run tests with coverage
        env:
          # 让被测代码走临时库，绝不碰仓库里的 config/music_monitor.db
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=20 \
            -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
