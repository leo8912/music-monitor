# ==============================================================================
# Music Monitor 配置文件 (Hybrid 模式)
# ==============================================================================
# 💡 说明:
# 本系统采用 "数据库 + 配置文件" 的混合配置模式。
# 1. 基础设施 (数据库、日志、路径): 必须在此文件或环境变量中配置。
# 2. 业务功能 (下载、监控、通知): 请启动后在网页端 "设置" 页面进行配置。
# 
# 👇 以下配置均为 基础设施配置 (Infrastructure)
# ==============================================================================

# --- 1. HTTP API 服务 ---
api:
  rate_limit:
    requests_per_minute: 60  # 限流: 每分钟请求数
    burst_size: 10          # 限流: 突发允许数
  timeout: 30               # 全局 API 超时 (秒)

# --- 2. 安全认证 (Auth) ---
auth:
  enabled: true
  username: "admin"         # 默认管理员用户
  password: "password"      # 默认管理员密码 (请修改!)
  secret_key: "CHANGE_ME"   # JWT 签名密钥 (⚠️ 必须修改以保证安全)
  algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# --- 3. 数据库 (Database) ---
database:
  # 默认使用 SQLite。如需 MySQL/PG，请修改 URL。
  # 格式: sqlite+aiosqlite:///路径 或 mysql+aiomysql://user:pass@host/db
  url: "sqlite+aiosqlite:///music_monitor.db"
  echo: false               # 是否打印 SQL (调试用)
  pool_size: 5
  max_overflow: 10

# --- 4. 日志 (Logging) ---
logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  file: "logs/application.log"
  max_bytes: 10485760       # 10MB
  backup_count: 5

# --- 5. 存储路径 (Storage) ---
storage:
  # 资料库: 存放您确认收藏的高质量文件 (只读，不自动删除)
  library_dir: "/library"
  
  # 缓存: 存放自动下载和试听的临时文件 (会自动清理)
  cache_dir: "/audio_cache"
  
  # 收藏: 点击红心后的文件存放处
  favorites_dir: "/favorites"
  
  # 缓存策略
  max_cache_size: 10737418240 # 10GB
  cleanup_threshold: 0.8      # 80%

# --- 6. 系统/外部链接 (System) ---
system:
    external_url: "http://localhost:8000" # 用于生成分享链接

# --- 7. Redis / 任务队列 (Redis & Queue) ---
# 生产 Docker 镜像内置 Redis (同容器) 并默认启用 (MM_REDIS__ENABLED=true)。
# 本地开发/测试默认关闭 → 任务队列降级为进程内执行，功能等价。
redis:
  enabled: false            # 是否启用 Redis + arq 任务队列
  unix_socket: "/tmp/redis.sock"  # Docker 内置 Redis unixsocket
  url: "redis://127.0.0.1:6379/0" # 备选 TCP 地址

# ==============================================================================
# 🚀 迁移辅助 (Migration Helper)
# 
# 如果通过 Config 迁移旧版通知设置，可以在此填写。
# 启动一次成功导入数据库后，可删除此部分，并在 UI 中管理。
# ==============================================================================
notify:
  wecom:
    enabled: false
    corpid: "wwxxxxxxxxxxxxxx"
    agentid: "1000001"
    corpsecret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    token: "xxxxxxxxxxxx"         # 回调 Token
    encoding_aes_key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" # 回调 AES Key
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
